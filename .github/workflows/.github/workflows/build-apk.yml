name: Build TCL PS5 Overlay APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Copy APK
        run: cp app/build/outputs/apk/debug/app-debug.apk tcl-ps5-gta6-overlay.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0 tcl-ps5-gta6-overlay.apk --title "TCL PS5 GTA 6 Overlay v1.0" --notes "APK جاهز للتثبيت على شاشة TCL" || gh release upload v1.0 tcl-ps5-gta6-overlay.apk --clobber
